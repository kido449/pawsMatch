[project]
name = "shelterops"
version = "0.1.0"
description = "PawsMatch — AI agent for foster/adopter matching (AWS Agents for Humans hackathon)"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[openai]>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
